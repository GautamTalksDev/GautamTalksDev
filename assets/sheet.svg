name: Measure and render sheet

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sheet
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compile benchmark
        run: g++ -O2 -std=c++20 -o jitter bench/jitter.cpp

      - name: Run benchmark
        run: ./jitter | tee bench/result.json

      - name: Render sheet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/render.mjs

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sheet.svg bench/result.json
          git diff --staged --quiet || git commit -m "measure: rebuild sheet from CI run"
          git push
