<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Gautam Khosla — Computer Engineering, University of Ottawa">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="frame"><rect width="1000" height="260" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)" opacity="0.55"/>
    <ellipse cx="200" cy="60" rx="380" ry="220" fill="url(#glow)"/>
    <ellipse cx="820" cy="220" rx="340" ry="200" fill="url(#glow)" opacity="0.7"/>

    <!-- scanning bar -->
    <rect x="0" y="-70" width="1000" height="70" fill="url(#scan)" opacity="0.5">
      <animate attributeName="y" from="-70" to="260" dur="5.5s" repeatCount="indefinite"/>
    </rect>

    <!-- circuit traces -->
    <g fill="none" stroke="#334155" stroke-width="1.4">
      <path d="M0 200 H160 L200 160 H360" stroke-dasharray="6 10">
        <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M1000 70 H860 L820 110 H660" stroke-dasharray="6 10">
        <animate attributeName="stroke-dashoffset" from="0" to="64" dur="3.1s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- orbiting nodes -->
    <g>
      <circle r="4" fill="#22d3ee">
        <animateMotion dur="9s" repeatCount="indefinite"
          path="M500,130 m-300,0 a300,95 0 1,0 600,0 a300,95 0 1,0 -600,0"/>
        <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle r="3" fill="#a78bfa">
        <animateMotion dur="9s" begin="-4.5s" repeatCount="indefinite"
          path="M500,130 m-300,0 a300,95 0 1,0 600,0 a300,95 0 1,0 -600,0"/>
      </circle>
      <circle r="2.5" fill="#f472b6">
        <animateMotion dur="13s" begin="-2s" repeatCount="indefinite"
          path="M500,130 m-420,0 a420,60 0 1,1 840,0 a420,60 0 1,1 -840,0"/>
      </circle>
    </g>

    <!-- name -->
    <text x="500" y="118" text-anchor="middle"
          font-family="'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="62" font-weight="700" letter-spacing="2"
          fill="url(#sweep)">GAUTAM KHOSLA</text>

    <!-- subtitle with typewriter reveal -->
    <g>
      <text x="500" y="160" text-anchor="middle"
            font-family="'Courier New', monospace" font-size="19" fill="#94a3b8">
        Computer Engineering @ University of Ottawa
      </text>
      <rect x="0" y="140" width="1000" height="30" fill="#05070d">
        <animate attributeName="x" values="0;1000" dur="2.2s" fill="freeze"/>
      </rect>
    </g>

    <!-- terminal line -->
    <g font-family="'Courier New', monospace" font-size="16">
      <text x="500" y="205" text-anchor="middle" fill="#475569">
        <tspan fill="#22d3ee">$</tspan> QNX &#183; C++20 &#183; TypeScript &#183; distributed systems
      </text>
      <rect x="798" y="192" width="9" height="17" fill="#22d3ee">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="1" y="1" width="998" height="258" rx="18" fill="none" stroke="#1e293b" stroke-width="2"/>
  </g>
</svg>
