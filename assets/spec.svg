<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="G. Khosla — Computer Engineering, University of Ottawa. Real-time systems and backend infrastructure.">
<defs>
  <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
  <marker id="a1" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#c0392b"/></marker>
  <clipPath id="f2"><rect width="1000" height="300"/></clipPath>
</defs>
<g clip-path="url(#f2)" font-family="Courier New,monospace">
  <rect width="1000" height="300" fill="#f4f2ec"/>

  <!-- frame plots in, fast -->
  <path d="M20 20 H980 V280 H20 Z" fill="none" stroke="#111" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" values="1;0;0;0" keyTimes="0;0.07;0.97;1" dur="11s" repeatCount="indefinite"/>
  </path>

  <!-- header strip -->
  <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.06;0.10;1" dur="11s" repeatCount="indefinite"/>
    <rect x="20" y="20" width="960" height="46" fill="#111"/>
    <text x="42" y="51" font-size="19" fill="#f4f2ec" letter-spacing="3">GAUTAM KHOSLA</text>
    <text x="958" y="51" text-anchor="end" font-size="15" fill="#8a8578" letter-spacing="1.5">REV 2026.07</text>
  </g>

  <!-- big claim: the thing worth reading at 380px -->
  <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.10;0.15;1" dur="11s" repeatCount="indefinite"/>
    <text x="42" y="126" font-family="Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#111">REAL-TIME SYSTEMS</text>
    <text x="42" y="170" font-family="Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#c0392b">&amp; BACKEND INFRA</text>
  </g>

  <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.15;0.20;1" dur="11s" repeatCount="indefinite"/>
    <text x="42" y="206" font-size="17" fill="#4a463c">Computer Engineering &#183; University of Ottawa</text>
    <text x="42" y="232" font-size="17" fill="#4a463c">Open to internships &#8212; backend, systems, infrastructure</text>
  </g>

  <!-- one measured spec, drawn as a dimension -->
  <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.20;0.26;1" dur="11s" repeatCount="indefinite"/>
    <line x1="600" y1="120" x2="940" y2="120" stroke="#c0392b" stroke-width="2" marker-start="url(#a1)" marker-end="url(#a2)"/>
    <text x="770" y="108" text-anchor="middle" font-size="15" fill="#c0392b" letter-spacing="1">ALARM PATH</text>
    <text x="600" y="152" font-size="17" fill="#111">SCHED_FIFO prio 30</text>
    <text x="600" y="178" font-size="17" fill="#8a8578">audio at prio 8</text>
    <text x="600" y="212" font-size="15" fill="#4a463c">I/O can never delay the alarm.</text>
    <text x="600" y="236" font-size="15" fill="#4a463c">QNX 8.0 &#183; C++20 &#183; Raspberry Pi 5</text>
  </g>

  <line x1="20" y1="256" x2="980" y2="256" stroke="#111" stroke-width="1"/>
  <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.26;0.32;1" dur="11s" repeatCount="indefinite"/>
    <text x="42" y="274" font-size="15" fill="#8a8578" letter-spacing="1.5">SHEET 1 OF 1 &#183; SCALE 1:1 &#183; DRAWN BY G.K.</text>
  </g>

  <g stroke="#c0392b" stroke-width="2" fill="none">
    <path d="M20 56 V20 H56"/><path d="M944 20 H980 V56"/>
    <path d="M20 244 V280 H56"/><path d="M944 280 H980 V244"/>
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
  </g>
</g>
</svg>
