<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Datasheet — G. Khosla, Computer Engineering, University of Ottawa">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#111"/>
  </marker>
  <marker id="al" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M10 0 L0 5 L10 10 z" fill="#111"/>
  </marker>
  <clipPath id="fr"><rect width="1000" height="430"/></clipPath>
</defs>

<g clip-path="url(#fr)" font-family="Courier New,monospace">
  <rect width="1000" height="430" fill="#f4f2ec"/>

  <!-- drafting frame, drawn in -->
  <g fill="none" stroke="#111" stroke-width="1.2">
    <path d="M18 18 H982 V412 H18 Z" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;0;0;0" keyTimes="0;0.16;0.97;1" dur="14s" repeatCount="indefinite"/>
    </path>
  </g>
  <g stroke="#111" stroke-width="1">
    <path d="M18 44 H982" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;1;0;0;0" keyTimes="0;0.12;0.22;0.97;1" dur="14s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- header row -->
  <g font-size="11.5" fill="#111" letter-spacing="1.4">
    <text x="34" y="36">GAUTAM KHOSLA</text>
    <text x="330" y="36">UNIVERSITY OF OTTAWA &#8212; COMPUTER ENGINEERING</text>
    <text x="966" y="36" text-anchor="end">REV 2026.07</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.26;1" dur="14s" repeatCount="indefinite"/>
  </g>

  <!-- dimension line -->
  <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.26;0.32;1" dur="14s" repeatCount="indefinite"/>
    <line x1="250" y1="86" x2="640" y2="86" stroke="#c0392b" stroke-width="1" marker-start="url(#al)" marker-end="url(#ar)"/>
    <text x="445" y="78" text-anchor="middle" font-size="10.5" fill="#c0392b" letter-spacing="1">SAFETY LOOP &#8212; NETWORK INDEPENDENT</text>
  </g>

  <!-- the part -->
  <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.38;1" dur="14s" repeatCount="indefinite"/>
    <rect x="330" y="110" width="230" height="176" fill="#111"/>
    <circle cx="352" cy="132" r="7" fill="none" stroke="#f4f2ec" stroke-width="1.4"/>
    <text x="445" y="186" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#f4f2ec" letter-spacing="1">G. KHOSLA</text>
    <text x="445" y="210" text-anchor="middle" font-size="11" fill="#8a8578" letter-spacing="2">SYSTEMS ENGINEER</text>
    <text x="445" y="252" text-anchor="middle" font-size="10" fill="#8a8578" letter-spacing="1.5">OPEN TO INTERNSHIPS</text>
    <text x="445" y="270" text-anchor="middle" font-size="10" fill="#8a8578" letter-spacing="1.5">2027</text>
  </g>

  <!-- pins -->
  <g stroke="#111" stroke-width="1.3" font-size="11" fill="#111">
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.38;0.5;1" dur="14s" repeatCount="indefinite"/>
      <path d="M330 138 H250"/><text x="242" y="142" text-anchor="end" stroke="none">QNX / RTOS</text>
      <path d="M330 174 H250"/><text x="242" y="178" text-anchor="end" stroke="none">C++20</text>
      <path d="M330 210 H250"/><text x="242" y="214" text-anchor="end" stroke="none">EMBEDDED VISION</text>
      <path d="M330 246 H250"/><text x="242" y="250" text-anchor="end" stroke="none">REAL-TIME SCHED</text>
    </g>
    <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.44;0.56;1" dur="14s" repeatCount="indefinite"/>
      <path d="M560 138 H640"/><text x="648" y="142" stroke="none">TYPESCRIPT</text>
      <path d="M560 174 H640"/><text x="648" y="178" stroke="none">POSTGRES / RLS</text>
      <path d="M560 210 H640"/><text x="648" y="214" stroke="none">DISTRIBUTED SYS</text>
      <path d="M560 246 H640"/><text x="648" y="250" stroke="none">OBSERVABILITY</text>
    </g>
  </g>

  <!-- characteristics table -->
  <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.56;0.66;1" dur="14s" repeatCount="indefinite"/>
    <line x1="34" y1="316" x2="640" y2="316" stroke="#111" stroke-width="1"/>
    <g font-size="10.5" fill="#111" letter-spacing="1">
      <text x="34" y="332">CHARACTERISTIC</text><text x="330" y="332">VALUE</text>
    </g>
    <line x1="34" y1="340" x2="640" y2="340" stroke="#111" stroke-width="0.6"/>
    <g font-size="11" fill="#333">
      <text x="34" y="358">alarm path priority</text><text x="330" y="358" fill="#111">SCHED_FIFO 30 &#183; audio at 8</text>
      <text x="34" y="376">orchestrator stages</text><text x="330" y="376" fill="#111">5 agents &#183; approval-gated</text>
      <text x="34" y="394">tenant isolation</text><text x="330" y="394" fill="#111">row-level security &#183; 10 migrations</text>
    </g>
  </g>

  <!-- title block -->
  <g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.72;1" dur="14s" repeatCount="indefinite"/>
    <rect x="700" y="306" width="266" height="90" fill="none" stroke="#111" stroke-width="1.2"/>
    <line x1="700" y1="336" x2="966" y2="336" stroke="#111" stroke-width="0.8"/>
    <line x1="700" y1="366" x2="966" y2="366" stroke="#111" stroke-width="0.8"/>
    <line x1="838" y1="336" x2="838" y2="396" stroke="#111" stroke-width="0.8"/>
    <g font-size="9.5" fill="#8a8578" letter-spacing="1.2">
      <text x="710" y="320">SHEET TITLE</text><text x="710" y="350">SHEET</text><text x="848" y="350">SCALE</text>
      <text x="710" y="380">DRAWN BY</text><text x="848" y="380">DATE</text>
    </g>
    <g font-size="11.5" fill="#111">
      <text x="710" y="332">PROFILE / OVERVIEW</text><text x="710" y="362">1 OF 1</text><text x="848" y="362">1:1</text>
      <text x="710" y="392">G.K.</text><text x="848" y="392">2026&#8211;07</text>
    </g>
  </g>

  <!-- corner registration ticks -->
  <g stroke="#c0392b" stroke-width="1.4">
    <path d="M18 60 V18 H60" fill="none"/><path d="M940 18 H982 V60" fill="none"/>
    <path d="M18 370 V412 H60" fill="none"/><path d="M940 412 H982 V370" fill="none"/>
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="4s" repeatCount="indefinite"/>
  </g>
</g>
</svg>
