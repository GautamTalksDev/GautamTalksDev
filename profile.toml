# Everything on the profile README comes from this file.
# Edit it, push, and the Action (.github/workflows/flight-log.yml) redraws every image and README.md.
#
# Adding a product:   copy a [[missions]] block, fill it in, pick a patch (seal, clock, flame, orbit, shield).
# Adding a project:   copy an [[orbit]] block. status = "live", "beta", "parked" or "docked".
# Every entry needs a public url: private work never goes on this page (the build refuses an entry without one).
# Adding a study: copy an [[expeditions]] block (name, url, field, visual, question, published, optional links).
# Adding a build to the hangar: name, url, about (full sentence) and tag (one short line for the tile).
# Dates are ISO (YYYY-MM-DD). Keep every claim true: the README is only as good as this file.

